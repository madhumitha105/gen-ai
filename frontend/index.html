<!DOCTYPE html>
<html>
<head>
    <title>AI Travel Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Travel Itinerary Planner</h1>
    <p class="subtitle">Your trip, clearly planned by AI</p>

    <h3>Plan Your Next Trip</h3>

    <div class="form">
        <input id="source" placeholder="Source (e.g. Chennai)">
        <input id="destination" placeholder="Destination (e.g. Paris)">
    
        <div class="input-group">
            <label>Departure Date</label>
            <input type="date" id="travel_date">
        </div>

        <div class="row">
            <div class="input-group">
                <label>Adults</label>
                <input type="number" id="adults" min="1" value="1">
            </div>
            <div class="input-group">
                <label>Children (2-11)</label>
                <input type="number" id="children" min="0" value="0">
            </div>
        </div>

        <input id="budget" placeholder="Total Budget (Currency based on Source)">
        <input id="days" placeholder="Days (e.g. 5)">
        <div class="bottom-row">
            <input id="food" placeholder="Food preference (Jain/Vegan)">
            <textarea id="specs" placeholder="Additional preferences..."></textarea>
            <button class="generate-btn" onclick="generatePlan()">Generate Itinerary</button>
        </div>
    </div>

    <div id="output"></div>

    <hr>

    <div class="chat-section">
        <h3>Discuss / Modify Plan</h3>

        <div class="chat-box" id="chat-box"></div>

        <div class="chat-input">
            <input id="chat-input" placeholder="Ask to modify itinerary...">
            <button onclick="sendChat()">Send</button>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
